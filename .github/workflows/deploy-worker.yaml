name: deploy-worker

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-worker.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Unpinned on purpose for the first run. Once a version deploys cleanly,
      # pin it here (wrangler@<major>.<minor>) so CI stops moving underneath us.
      - name: Deploy to Cloudflare Workers
        run: npx --yes wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
