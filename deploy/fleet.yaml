# Fleet bundle — the ash4d.com origin.
#
# This deploys the REAL site into the home lab cluster (c-nnzn9 / sdf1), which is
# where the site is hosted. The GCP edge is only an nginx caching reverse proxy in
# front of it:
#
#   ash4d.com → GCP edge (TLS + proxy_cache) → Tailscale → 192.168.7.150
#     → Host: origin.ash4d.com → this Deployment
#
# It replaces the placeholder that lab-fleet's `16-ash4d-origin` used to own — that
# bundle served a static ConfigMap and is retired in favour of this one. The
# manifests here are deliberately shaped for the LAB cluster, not the edge:
#   - namespace `ash4d-origin`, workload named `origin`
#   - `ingressClassName: traefik` (the lab runs Traefik; the edge runs ingress-nginx)
#   - host `origin.ash4d.com`, and NO TLS block — the edge terminates TLS
#
# The image tag is pinned by CI: pushing to `site/**` builds
# ghcr.io/darthzen/ash4d:<sha> and rewrites deployment.yaml here, so a content
# change reaches the cluster with no manual step.
#
# No `defaultNamespace` on purpose — every manifest carries an explicit
# `namespace: ash4d-origin`, and setting it here would only add a second source of
# truth for the same value.

# Raw-manifest bundle, but Fleet deploys it via Helm internally. takeOwnership lets
# it adopt any object left behind by the retired `lab-ash4d-origin` bundle instead
# of refusing to touch resources carrying another release's annotations.
helm:
  takeOwnership: true
