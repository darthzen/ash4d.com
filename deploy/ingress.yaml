# No TLS block on purpose: Cloudflare terminates TLS at its edge and the
# cloudflared tunnel delivers plain HTTP to Traefik with the real hostname
# preserved. `origin.ash4d.com` stays routable for direct lab access.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: origin
  namespace: ash4d-origin
spec:
  ingressClassName: traefik
  rules:
    - host: origin.ash4d.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: origin
                port:
                  number: 80
    - host: ash4d.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: origin
                port:
                  number: 80
    - host: www.ash4d.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: origin
                port:
                  number: 80
