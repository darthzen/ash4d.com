# No TLS block on purpose: the GCP edge terminates TLS for ash4d.com and proxies
# here over Tailscale as plain HTTP with `Host: origin.ash4d.com`.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: origin
  namespace: ash4d-origin
spec:
  ingressClassName: traefik
  rules:
    - host: origin.ash4d.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: origin
                port:
                  number: 80
